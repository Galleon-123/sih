name: Deploy UniServ to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Inject Firebase config into Organizer Portal (optional) ─
      - name: Inject Firebase config into Organizer Portal
        if: ${{ env.FIREBASE_API_KEY != '' }}
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_ORGANIZER_APP_ID: ${{ secrets.FIREBASE_ORGANIZER_APP_ID }}
        run: |
          for f in UniServ-Organizer/js/firebase-data.js UniServ-Organizer/js/firebase.js; do
            if [ -f "$f" ]; then
              sed -i \
                -e "s|'YOUR_API_KEY'|'${FIREBASE_API_KEY}'|g" \
                -e "s|YOUR_PROJECT_ID\.firebaseapp\.com|${FIREBASE_PROJECT_ID}.firebaseapp.com|g" \
                -e "s|'YOUR_PROJECT_ID'|'${FIREBASE_PROJECT_ID}'|g" \
                -e "s|YOUR_PROJECT_ID\.firebasestorage\.app|${FIREBASE_PROJECT_ID}.firebasestorage.app|g" \
                -e "s|'YOUR_MESSAGING_SENDER_ID'|'${FIREBASE_MESSAGING_SENDER_ID}'|g" \
                -e "s|'YOUR_ORGANIZER_APP_ID'|'${FIREBASE_ORGANIZER_APP_ID}'|g" \
                "$f"
            fi
          done

      # ── Inject Firebase config into Worker App (optional) ───────
      - name: Inject Firebase config into Worker App
        if: ${{ env.FIREBASE_API_KEY != '' }}
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_WORKER_APP_ID: ${{ secrets.FIREBASE_WORKER_APP_ID }}
        run: |
          for f in UniServ-Worker/src/firebase/firebase.js UniServ-Worker/src/firebase/firebase.web.js; do
            if [ -f "$f" ]; then
              sed -i \
                -e "s|'YOUR_API_KEY'|'${FIREBASE_API_KEY}'|g" \
                -e "s|YOUR_PROJECT_ID\.firebaseapp\.com|${FIREBASE_PROJECT_ID}.firebaseapp.com|g" \
                -e "s|'YOUR_PROJECT_ID'|'${FIREBASE_PROJECT_ID}'|g" \
                -e "s|YOUR_PROJECT_ID\.firebasestorage\.app|${FIREBASE_PROJECT_ID}.firebasestorage.app|g" \
                -e "s|'YOUR_MESSAGING_SENDER_ID'|'${FIREBASE_MESSAGING_SENDER_ID}'|g" \
                -e "s|'YOUR_WORKER_APP_ID'|'${FIREBASE_WORKER_APP_ID}'|g" \
                "$f"
            fi
          done

      # ── Inject Firebase config into User App (optional) ────────
      - name: Inject Firebase config into User App
        if: ${{ env.FIREBASE_API_KEY != '' }}
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_USER_APP_ID: ${{ secrets.FIREBASE_USER_APP_ID }}
        run: |
          for f in UniServ/src/firebase/firebase.js UniServ/src/firebase/firebase.web.js; do
            if [ -f "$f" ]; then
              sed -i \
                -e "s|'YOUR_API_KEY'|'${FIREBASE_API_KEY}'|g" \
                -e "s|YOUR_PROJECT_ID\.firebaseapp\.com|${FIREBASE_PROJECT_ID}.firebaseapp.com|g" \
                -e "s|'YOUR_PROJECT_ID'|'${FIREBASE_PROJECT_ID}'|g" \
                -e "s|YOUR_PROJECT_ID\.firebasestorage\.app|${FIREBASE_PROJECT_ID}.firebasestorage.app|g" \
                -e "s|'YOUR_MESSAGING_SENDER_ID'|'${FIREBASE_MESSAGING_SENDER_ID}'|g" \
                -e "s|'YOUR_APP_ID'|'${FIREBASE_USER_APP_ID}'|g" \
                "$f"
            fi
          done

      # ── Build Worker App (Expo web) ───────────────────────────
      - name: Install Worker App dependencies
        working-directory: UniServ-Worker
        run: npm install --legacy-peer-deps

      - name: Build Worker App for web
        working-directory: UniServ-Worker
        run: npx expo export --platform web --output-dir dist
        env:
          NODE_ENV: production

      # ── Build User App (Expo web) ─────────────────────────────
      - name: Install User App dependencies
        working-directory: UniServ
        run: npm install --legacy-peer-deps

      - name: Build User App for web
        working-directory: UniServ
        run: npx expo export --platform web --output-dir dist
        env:
          NODE_ENV: production

      # ── Assemble final site ───────────────────────────────────
      - name: Assemble deployment folder
        run: |
          mkdir -p _site/worker
          mkdir -p _site/app
          mkdir -p _site/organizer

          # Organizer Portal at /organizer/
          cp -r UniServ-Organizer/. _site/organizer/
          # Worker App at /worker/
          cp -r UniServ-Worker/dist/. _site/worker/
          # User App at /app/
          cp -r UniServ/dist/. _site/app/

          # Landing index at root
          cat > _site/index.html << 'LANDING'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>UniServ — Smart India Hackathon 2026</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2rem; padding: 2rem; }
              h1 { font-size: 2.75rem; font-weight: 800; letter-spacing: -0.025em; }
              h1 span { color: #3b82f6; }
              p.sub { color: #94a3b8; font-size: 1.1rem; max-width: 600px; text-align: center; line-height: 1.5; }
              .cards { display: flex; gap: 1.5rem; flex-wrap: wrap; justify-content: center; margin-top: 1rem; max-width: 900px; }
              .card { background: #1e293b; border: 1px solid #334155; border-radius: 18px; padding: 2rem; width: 260px; text-align: center; text-decoration: none; color: inherit; transition: transform .2s, border-color .2s, box-shadow .2s; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
              .card:hover { transform: translateY(-5px); border-color: #3b82f6; box-shadow: 0 12px 30px rgba(59,130,246,0.25); }
              .icon { font-size: 3rem; margin-bottom: 1rem; }
              .card h2 { font-size: 1.25rem; margin-bottom: .5rem; font-weight: 700; color: #f1f5f9; }
              .card p { font-size: .875rem; color: #94a3b8; line-height: 1.4; flex: 1; }
              .badge { display: inline-block; margin-top: 1.25rem; padding: .35rem .85rem; background: #2563eb; color: #fff; border-radius: 999px; font-size: .75rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
              footer { font-size: 0.8rem; color: #64748b; margin-top: 1rem; text-align: center; }
            </style>
          </head>
          <body>
            <div style="text-align:center; display:flex; flex-direction:column; align-items:center; gap:0.5rem;">
              <h1>Uni<span>Serv</span></h1>
              <p class="sub">Next-Gen Cooperative Blue-Collar Service &amp; Fair-Wage Ecosystem</p>
              <p style="font-size:0.85rem; color:#60a5fa; font-weight:600;">Ministry of Cooperation · Smart India Hackathon 2026</p>
            </div>
            <div class="cards">
              <a class="card" href="organizer/index.html">
                <div class="icon">🏢</div>
                <h2>Organizer Portal</h2>
                <p>Manage cooperative workers, e-KYC approvals, assessment tokens, ward heatmaps &amp; live bookings.</p>
                <span class="badge">Web Dashboard</span>
              </a>
              <a class="card" href="worker/">
                <div class="icon">👷</div>
                <h2>Worker Web App</h2>
                <p>Job dispatch alerts, live GPS tracking, physical OTP handshakes, wallet earnings &amp; welfare fund.</p>
                <span class="badge">Worker App</span>
              </a>
              <a class="card" href="app/">
                <div class="icon">📱</div>
                <h2>Customer App</h2>
                <p>Browse 10 artisanal trades, transparent pricing, live worker tracking, rating &amp; Seva Suraksha warranty.</p>
                <span class="badge">Customer App</span>
              </a>
            </div>
            <footer>
              UniServ Platform · Multi-State Cooperative Societies (MSCS) Act 2002 Compliant
            </footer>
          </body>
          </html>
          LANDING

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
