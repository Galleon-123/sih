name: Deploy Organizer Portal to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'UniServ-Organizer/**'
      - '.github/workflows/deploy-portal.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Firebase config into firebase-data.js
        run: |
          sed -i \
            -e "s|'YOUR_API_KEY'|'${{ secrets.FIREBASE_API_KEY }}'|g" \
            -e "s|YOUR_PROJECT_ID\.firebaseapp\.com|${{ secrets.FIREBASE_PROJECT_ID }}.firebaseapp.com|g" \
            -e "s|'YOUR_PROJECT_ID'|'${{ secrets.FIREBASE_PROJECT_ID }}'|g" \
            -e "s|YOUR_PROJECT_ID\.appspot\.com|${{ secrets.FIREBASE_PROJECT_ID }}.appspot.com|g" \
            -e "s|'YOUR_MESSAGING_SENDER_ID'|'${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}'|g" \
            -e "s|'YOUR_ORGANIZER_APP_ID'|'${{ secrets.FIREBASE_ORGANIZER_APP_ID }}'|g" \
            UniServ-Organizer/js/firebase-data.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: UniServ-Organizer

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
